name: MMGIS image build and manual release

on:
  pull_request:
    branches: [main, master, development]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed main commit to this repository's GHCR
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mmgis-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image-build:
    name: Build complete image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      MMGIS_ARCH: ${{ matrix.arch }}
      MMGIS_SOURCE_COMMIT: ${{ github.sha }}
      MMGIS_PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build both frontends and complete runtime image
        run: |
          IMAGE_TAG="mmgis-ci:${MMGIS_SOURCE_COMMIT}-${MMGIS_ARCH}"
          docker buildx build --load --platform "linux/${MMGIS_ARCH}" \
            --tag "$IMAGE_TAG" \
            --build-arg "SOURCE_COMMIT=${MMGIS_SOURCE_COMMIT}" \
            --build-arg "PUBLIC_URL_ARG=${MMGIS_PUBLIC_URL}" .
          ARTIFACT_CONTAINER=$(docker create "$IMAGE_TAG")
          trap 'docker rm "$ARTIFACT_CONTAINER" >/dev/null' EXIT
          mkdir -p delivery
          docker cp "${ARTIFACT_CONTAINER}:/usr/src/app/API/i18n/generated/delivery-manifest.json" \
            "delivery/delivery-manifest-${MMGIS_ARCH}.json"
      - name: Save manifest from the actual image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mmgis-delivery-${{ matrix.arch }}
          path: delivery/*.json
          if-no-files-found: error

  publish-architecture:
    # A PR, push, tag or release event can never publish an image.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: image-build
    environment: mmgis-release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      MMGIS_ARCH: ${{ matrix.arch }}
      MMGIS_SOURCE_COMMIT: ${{ github.sha }}
      MMGIS_REPOSITORY: ${{ github.repository }}
      MMGIS_PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Publish reviewed architecture image
        run: |
          IMAGE_ID="ghcr.io/${MMGIS_REPOSITORY,,}"
          UPSTREAM_VERSION=$(node -p 'require("./package.json").version')
          IMAGE_TAG="${UPSTREAM_VERSION}-zh-cn-${MMGIS_SOURCE_COMMIT}"
          docker buildx build --push --platform "linux/${MMGIS_ARCH}" \
            --tag "${IMAGE_ID}:${IMAGE_TAG}-${MMGIS_ARCH}" \
            --build-arg "SOURCE_COMMIT=${MMGIS_SOURCE_COMMIT}" \
            --build-arg "PUBLIC_URL_ARG=${MMGIS_PUBLIC_URL}" .

  publish-manifest:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: publish-architecture
    environment: mmgis-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      MMGIS_SOURCE_COMMIT: ${{ github.sha }}
      MMGIS_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Combine architectures and record immutable image reference
        run: |
          IMAGE_ID="ghcr.io/${MMGIS_REPOSITORY,,}"
          UPSTREAM_VERSION=$(node -p 'require("./package.json").version')
          IMAGE_TAG="${UPSTREAM_VERSION}-zh-cn-${MMGIS_SOURCE_COMMIT}"
          docker buildx imagetools create --tag "${IMAGE_ID}:${IMAGE_TAG}" \
            "${IMAGE_ID}:${IMAGE_TAG}-amd64" "${IMAGE_ID}:${IMAGE_TAG}-arm64"
          mkdir -p delivery
          docker buildx imagetools inspect "${IMAGE_ID}:${IMAGE_TAG}" \
            --format '{{json .Manifest}}' > delivery/image-descriptor.json
          IMAGE_DIGEST=$(jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))' delivery/image-descriptor.json)
          jq -n --arg version "$UPSTREAM_VERSION" --arg commit "$MMGIS_SOURCE_COMMIT" \
            --arg tag "${IMAGE_ID}:${IMAGE_TAG}" --arg digest "$IMAGE_DIGEST" \
            --arg image "${IMAGE_ID}@${IMAGE_DIGEST}" \
            '{upstreamVersion:$version,sourceCommit:$commit,tag:$tag,digest:$digest,image:$image}' \
            > delivery/image-lock.json
          cat delivery/image-lock.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mmgis-release-lock
          path: delivery/*.json
          if-no-files-found: error
